[project]
name = "arxiv-daily"
version = "0.1.1"
description = "Tracking daily arXiv updates and generating intelligent summaries with LLMs."
readme = "README.md"
authors = [
    { name = "yuliu", email = "yuliu@gzu.edu.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-deepseek>=1.0.1",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.5",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "typer>=0.21.0",
]

[project.urls]
Repository = "https://github.com/GZU-MuTian/arxiv-daily"

[project.scripts]
arXiv = "arxiv_daily.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"